<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <p class="profile-header__eyebrow">과제 5 [회원가입]</p>
    <title>회원가입</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            background: linear-gradient(160deg, #f7f5fb 0%, #ece6fb 50%, #e4d9f7 100%);
            color: #3f3757;
        }

        .page {
            max-width: 720px;
            margin: 0 auto;
        }

        .profile-header {
            text-align: center;
            padding: 36px 24px 8px;
        }

        .profile-header__eyebrow {
            display: inline-block;
            padding: 4px 14px;
            margin-bottom: 12px;
            border-radius: 999px;
            background: #ffffff;
            color: #8a6fd6;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(138, 111, 214, 0.15);
        }

        .profile-header__title {
            margin: 0 0 14px;
            font-size: 28px;
            font-weight: 700;
            color: #4b3f72;
        }

        .profile-header__intro {
            margin: 0 auto;
            max-width: 520px;
            font-size: 15px;
            line-height: 1.7;
            color: #6d6288;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 28px 0;
        }

        fieldset {
            background: #ffffff;
            border: 1px solid #ece5fa;
            border-radius: 18px;
            padding: 28px 30px;
            box-shadow: 0 10px 30px rgba(150, 120, 220, 0.08);
        }

        legend {
            padding: 4px 12px;
            margin-left: 6px;
            font-size: 16px;
            font-weight: 700;
            color: #5b4d8a;
            background: #f4effc;
            border-radius: 999px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #4b3f72;
        }

        .required-mark {
            margin-left: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #a37fe0;
        }

        input[type="text"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            font-family: inherit;
            color: #3f3757;
            background: #f9f6ff;
            border: 1px solid #e4d9f7;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            border-color: #b6a3ea;
            box-shadow: 0 0 0 3px rgba(182, 163, 234, 0.25);
        }

        textarea {
            resize: vertical;
            line-height: 1.6;
        }

        .email-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .email-row input[type="text"] {
            flex: 1;
            min-width: 140px;
        }

        .email-row span {
            color: #a496c7;
            font-weight: 700;
        }

        .email-row select {
            flex: 1;
            min-width: 140px;
        }

        .choice-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
        }

        .choice-group--column {
            flex-direction: column;
            gap: 10px;
        }

        .choice-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0;
            font-weight: 500;
            color: #4b3f72;
            cursor: pointer;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #8a6fd6;
        }

        .form-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            padding: 4px 0 32px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 13px 34px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="submit"] {
            background: linear-gradient(135deg, #a98cec, #8a6fd6);
            color: #ffffff;
            box-shadow: 0 10px 24px rgba(138, 111, 214, 0.35);
        }

        input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(138, 111, 214, 0.4);
        }

        input[type="reset"] {
            background: #f4effc;
            color: #6d4fc4;
            border: 1px solid #e4d9f7;
        }

        input[type="reset"]:hover {
            background: #ece5fa;
        }

        .profile-footer {
            text-align: center;
            padding: 12px 0 32px;
            font-size: 13px;
            color: #a496c7;
        }
    </style>
</head>
<body>
    <div class="page">

        <header class="profile-header">
            <p class="profile-header__eyebrow">SKALA-FRONT</p>
            <h1 class="profile-header__title">👤 회원가입</h1>
            <p class="profile-header__intro">
                SKALA-FRONT 회원가입을 환영합니다. <br>
                아래 정보를 입력하고 새로운 여정을 함께 시작해요.
            </p>
        </header>

        <form action="signUpResult.html" method="get">

            <fieldset>
                <legend>계정 정보</legend>

                <div class="field">
                    <label for="userId">아이디<span class="required-mark">(필수)</span></label>
                    <input type="text" id="userId" name="userId" minlength="4" maxlength="15" required placeholder="4~15자 영문/숫자">
                </div>

                <div class="field">
                    <label for="userPw">비밀번호<span class="required-mark">(필수)</span></label>
                    <input type="password" id="userPw" name="userPw" minlength="8" required placeholder="8자 이상 입력">
                </div>

                <div class="field">
                    <label for="userEmail">이메일</label>
                    <div class="email-row">
                        <input type="text" id="userEmail" name="userEmail" placeholder="example">
                        <span>@</span>
                        <select name="emailDomain">
                            <option value="direct">직접 입력</option>
                            <option value="naver.com">naver.com</option>
                            <option value="gmail.com">gmail.com</option>
                            <option value="daum.net">daum.net</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>개인 프로필 정보</legend>

                <div class="field">
                    <label for="userName">이름<span class="required-mark">(필수)</span></label>
                    <input type="text" id="userName" name="userName" required placeholder="이름을 입력해 주세요">
                </div>

                <div class="field">
                    <label for="userBirth">생년월일</label>
                    <input type="date" id="userBirth" name="userBirth">
                </div>

                <div class="field">
                    <label>성별</label>
                    <div class="choice-group">
                        <label><input type="radio" name="gender" value="male" checked> 남성</label>
                        <label><input type="radio" name="gender" value="female"> 여성</label>
                        <label><input type="radio" name="gender" value="none"> 선택안함</label>
                    </div>
                </div>

                <div class="field">
                    <label>관심 분야 (중복 선택 가능)</label>
                    <div class="choice-group choice-group--column">
                        <label><input type="checkbox" name="interest" value="frontend"> 웹 프론트엔드 (Vue.js/HTML)</label>
                        <label><input type="checkbox" name="interest" value="uiux"> UI/UX 디자인 표준</label>
                        <label><input type="checkbox" name="interest" value="backend"> 백엔드 & 데이터베이스</label>
                        <label><input type="checkbox" name="interest" value="devops"> 클라우드 & 인프라</label>
                    </div>
                </div>

                <div class="field">
                    <label for="joinPath">가입 경로</label>
                    <select id="joinPath" name="joinPath">
                        <option value="" disabled selected>-- 선택해 주세요 --</option>
                        <option value="search">인터넷 검색</option>
                        <option value="friend">지인 추천</option>
                        <option value="sns">SNS 광고</option>
                        <option value="etc">기타</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>자기소개</legend>

                <div class="field">
                    <label for="intro">나를 표현하는 한 줄 소개 또는 가입 인사</label>
                    <textarea id="intro" name="intro" rows="5" cols="50" maxlength="200" placeholder="여기에 내용을 입력하세요 (최대 200자)"></textarea>
                </div>
            </fieldset>

            <div class="form-actions">
                <input type="submit" value="동의하고 회원가입">
                <input type="reset" value="다시 작성">
            </div>

        </form>

        <footer class="profile-footer">
            <p>Made with 💜(love) by 최규원</p>
        </footer>

    </div>
</body>
</html>
