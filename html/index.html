<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome SKALA</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #2e1065 0%, #6d28d9 45%, #c084fc 100%);
            color: #fdf4ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: min(860px, 100%);
            background: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(70, 20, 120, 0.35);
            padding: 36px;
        }

        .badge {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.22);
            font-size: 0.95rem;
            margin-bottom: 16px;
            color: #fff7ff;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.9rem, 4vw, 2.8rem);
        }

        .subtitle {
            margin: 0 0 24px;
            font-size: 1.05rem;
            line-height: 1.7;
            color: #f5e8ff;
        }

        .link-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .link-card {
            display: block;
            padding: 20px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .link-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(46, 16, 101, 0.28);
        }

        .icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
            display: block;
        }

        .link-card h3 {
            margin: 0 0 6px;
            font-size: 1.08rem;
        }

        .link-card p {
            margin: 0;
            font-size: 0.95rem;
            color: #f3e8ff;
            line-height: 1.5;
        }

        .footer {
            margin-top: 24px;
            font-size: 0.92rem;
            color: #e9d5ff;
            text-align: center;
        }

        @media (max-width: 700px) {
            .link-list {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">📌 과제 1 [Project 구성과 index.html 생성]</div>
        <h1>환영 인사 (Warm Welcome)</h1>
        <p class="subtitle">
            스칼라에 오신 것을 환영합니다.<br>
            안녕하세요 SKALA 교육생 최규원입니다.<br>
            이 페이지는 제 GitHub와 포트폴리오를 한눈에 볼 수 있도록 정리한 소개 페이지입니다.
        </p>

        <div class="link-list">
            <a class="link-card" href="https://github.com/gyu2301/" target="_blank" rel="noopener noreferrer">
                <span class="icon">💻</span>
                <h3>나의 GitHub 연결</h3>
            </a>
            <a class="link-card" href="https://gyu2301.github.io/SKALA-Portfolio/" target="_blank" rel="noopener noreferrer">
                <span class="icon">🎨</span>
                <h3>나의 포트폴리오</h3>
            </a>
            <a class="link-card" href="myHoliday.html">
                <span class="icon">🏖️</span>
                <h3>My Holiday</h3>
                <p>나의 휴일/일정 페이지</p>
            </a>
            <a class="link-card" href="myProfile.html">
                <span class="icon">🙋</span>
                <h3>My Profile</h3>
                <p>나의 프로필 소개 페이지</p>
            </a>
            <a class="link-card" href="myClass.html">
                <span class="icon">📚</span>
                <h3>My Class</h3>
                <p>나의 수업 페이지</p>
            </a>
        </div>
    </div>
</body>
</html>
